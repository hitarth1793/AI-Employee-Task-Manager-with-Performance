{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Create account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn primary wide">Register</button>
        </form>
        <p class="center">Already registered? <a href="{% url 'accounts:login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
